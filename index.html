<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NZ</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg1:#04050f;--bg2:#0a0b2a;--txt:#f3e8ff;box-sizing:border-box;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none;
background:radial-gradient(120% 90% at 50% 40%,var(--bg2),var(--bg1));font-family:'Poppins',sans-serif;font-weight:600;color:var(--txt)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#flash{position:fixed;inset:0;background:radial-gradient(circle,#fff,#c79bff 40%,transparent 70%);opacity:0;pointer-events:none}
.t{position:fixed;left:0;right:0;text-align:center;pointer-events:none}
#title{top:calc(env(safe-area-inset-top,0px) + 4.5%);font-size:clamp(15px,4vw,22px);letter-spacing:.18em;
background:linear-gradient(90deg,#c8ff6a,#27f0e0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(39,240,224,.5))}
#hint{top:calc(env(safe-area-inset-top,0px) + 7%);font-size:clamp(12px,3.3vw,15px);font-weight:300;letter-spacing:.22em;opacity:.8;transition:opacity 1s;padding:0 24px;text-shadow:0 0 12px rgba(180,200,255,.35)}
#foot{bottom:calc(env(safe-area-inset-bottom,0px) + 11%);opacity:0;transition:opacity 2.4s;padding:0 24px}
#h1{font-size:clamp(20px,6vw,34px);font-weight:300;letter-spacing:.06em;color:#ffe6f1;text-shadow:0 0 18px rgba(255,120,180,.7)}
#sub{margin-top:10px;font-size:clamp(11px,3.2vw,15px);line-height:1.6;min-height:3.2em;opacity:.92}
#sub::after{content:"";display:inline-block;width:2px;height:1em;background:#fff;margin-left:3px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#tools{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:none;gap:6px;opacity:.5}
button{font:inherit;font-size:11px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 10px;cursor:pointer}
</style>
</head>
<body>
<div id="flash"></div>

<div id="hint" class="t"></div>
<div id="foot" class="t"><div id="h1">Səni çooox sevirəmm</div></div>
<div id="tools"><button id="snd">Ses: açık</button><button id="rst">Yeniden başla</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== AYARLAR =====
const CFG={nameA:"NİHAD",nameB:"ZEHRA",heartWord:"Zehra",
 sub:"Ateş ve ışıktan bir yıldız dansı, yollarımız bir kucaklaşmada birleşiyor.",
 colA:[1,.42,.68],colB:[.36,.88,1],   // Nihad macenta, Zehra turkuaz
 period:.9,                              // kalp atışı periyodu (sn)
 vibrate:true};
const $=id=>document.getElementById(id);
const mobile=Math.min(innerWidth,innerHeight)<700;
const NP=mobile?3000:6000, NH=mobile?240:380, HL=14;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),lerp=(a,b,t)=>a+(b-a)*t;
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const gauss=()=>(Math.random()+Math.random()+Math.random()-1.5)/1.5;

let W,H,camZ,R,S,wordW,portrait,C0,hc,state='load';
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:false});
renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(50,1,1,6000);
const DPR=Math.min(devicePixelRatio||1,2);renderer.setPixelRatio(DPR);
const U={uDpr:{value:DPR},uCamZ:{value:900}};

// --- doku yardımcıları
function mkTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;t.generateMipmaps=false;return t;}
const glowTex=mkTex(128,128,(x,w)=>{const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(255,255,255,.5)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.fillRect(0,0,128,128);});
const streakTex=mkTex(512,32,(x)=>{const g=x.createLinearGradient(0,0,512,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');x.shadowColor='#fff';x.shadowBlur=12;x.fillStyle=g;x.fillRect(0,14,512,4);});
const add={transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,depthTest:false};
const mkSprite=c=>{const s=new THREE.Sprite(new THREE.SpriteMaterial(Object.assign({map:glowTex,color:c},add)));s.material.opacity=0;scene.add(s);return s;};
const glowA=mkSprite(0xff6bad),glowB=mkSprite(0x5ce0ff),core=mkSprite(0xff9ccb);
const streaks=[0,1].map(g=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(1,1),new THREE.MeshBasicMaterial(Object.assign({map:streakTex,color:g?0x5ce0ff:0xff6bad},add)));scene.add(m);return m;});

// --- yıldızlar
const stars=(()=>{const n=260,g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
 const sz=new Float32Array(n),ph=new Float32Array(n);for(let i=0;i<n;i++){sz[i]=rnd(1,2.4);ph[i]=rnd(0,6.3);}
 g.setAttribute('size',new THREE.BufferAttribute(sz,1));g.setAttribute('ph',new THREE.BufferAttribute(ph,1));
 const m=new THREE.ShaderMaterial({uniforms:Object.assign({uT:{value:0}},U),transparent:true,depthWrite:false,
 vertexShader:'attribute float size,ph;uniform float uDpr,uCamZ,uT;varying float vA;void main(){vA=.3+.7*abs(sin(uT*.8+ph));vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*uDpr*uCamZ/(-mv.z);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(.75,.8,1.,smoothstep(.5,.1,d)*vA);}'});
 const p=new THREE.Points(g,m);p.frustumCulled=false;scene.add(p);return p;})();

// --- toz parçacıkları (yazı -> galaksi -> çekirdek)
const N=NP*2,POS=new Float32Array(N*3),COL=new Float32Array(N*3),SZ=new Float32Array(N);
const gi=new Uint8Array(N),lag=new Uint8Array(N),tx=new Float32Array(N),ty=new Float32Array(N),rr=new Float32Array(N),th=new Float32Array(N),dl=new Float32Array(N),mx=new Float32Array(N);
const dg=new THREE.BufferGeometry();dg.setAttribute('position',new THREE.BufferAttribute(POS,3).setUsage(THREE.DynamicDrawUsage));
dg.setAttribute('col',new THREE.BufferAttribute(COL,3).setUsage(THREE.DynamicDrawUsage));dg.setAttribute('size',new THREE.BufferAttribute(SZ,1));
const dustMat=new THREE.ShaderMaterial(Object.assign({uniforms:Object.assign({uA:{value:1}},U),
 vertexShader:'attribute vec3 col;attribute float size;uniform float uDpr,uCamZ;varying vec3 vC;void main(){vC=col;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=size*uDpr*uCamZ/(-mv.z);gl_Position=projectionMatrix*mv;}',
 fragmentShader:'uniform float uA;varying vec3 vC;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vC,smoothstep(.5,.05,d)*uA);}'},add));
const dust=new THREE.Points(dg,dustMat);dust.frustumCulled=false;scene.add(dust);
for(let i=0;i<N;i++)SZ[i]=rnd(1.2,2.3)*(mobile?1:1.15);

function scanWord(txt,wpx){const c=document.createElement('canvas');c.width=760;c.height=240;const x=c.getContext('2d');
 x.fillStyle='#fff';x.font='600 170px Poppins';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,380,125);
 const d=x.getImageData(0,0,760,240).data,p=[];let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
 for(let y=0;y<240;y+=2)for(let xx=0;xx<760;xx+=2)if(d[(y*760+xx)*4+3]>128){p.push(xx,y);x0=Math.min(x0,xx);x1=Math.max(x1,xx);y0=Math.min(y0,y);y1=Math.max(y1,y);}
 const sc=wpx/(x1-x0);return{p,sc,mx:(x0+x1)/2,my:(y0+y1)/2,h:(y1-y0)*sc};}

let cen,hist,hp=0;
function buildDust(){
 const sc=[scanWord(CFG.nameA,wordW),scanWord(CFG.nameB,wordW)];
 for(let g=0;g<2;g++){const s=sc[g],n=s.p.length/2;
  for(let k=0;k<NP;k++){const i=g*NP+k,j=((Math.random()*n)|0)*2;
   tx[i]=C0[g].x+(s.p[j]-s.mx)*s.sc;ty[i]=C0[g].y-(s.p[j+1]-s.my)*s.sc;
   const halo=Math.random()<.08,r=halo?1+Math.random()*.6:Math.pow(Math.random(),.55);
   rr[i]=r;th[i]=r*3.6+(Math.random()<.5?0:Math.PI)+gauss()*(.12+r*.55);
   dl[i]=Math.random()*.6;lag[i]=(Math.pow(Math.random(),2)*(HL-1))|0;mx[i]=Math.random();gi[i]=g;}
  streaks[g].scale.set(wordW*2.4,14,1);streaks[g].position.set(C0[g].x,C0[g].y-s.h*.58,0);}
 cen=C0.map(c=>({x:c.x,y:c.y,tx:c.x,ty:c.y}));
 hist=[0,1].map(g=>{const a=new Float32Array(HL*2);for(let k=0;k<HL;k++){a[k*2]=C0[g].x;a[k*2+1]=C0[g].y;}return a;});
}

// --- kalp (Zehra kelimeleri)
let heart,hMat;
function buildHeart(){
 const tex=mkTex(512,192,(x)=>{x.fillStyle='#fff';x.font='600 150px Poppins';x.textAlign='center';x.textBaseline='middle';x.fillText(CFG.heartWord,256,100);});
 const base=new THREE.PlaneGeometry(1,1),g=new THREE.InstancedBufferGeometry();g.index=base.index;
 g.setAttribute('position',base.attributes.position);g.setAttribute('uv',base.attributes.uv);g.instanceCount=NH;
 const P=new Float32Array(NH*3),D=new Float32Array(NH),T=new Float32Array(NH),O=new Float32Array(NH),Cl=new Float32Array(NH*3);
 const pal=[[1,1,1],[1,.88,.93],[1,.72,.84],[.95,.8,1]],nc=Math.floor(NH*.6);
 for(let i=0;i<NH;i++){let t,k;
  if(i<nc){t=i/nc*Math.PI*2+rnd(-.04,.04);k=1+rnd(-.03,.03);}else{t=rnd(0,6.283);k=.15+.8*Math.sqrt(Math.random());}
  const hx=16*Math.pow(Math.sin(t),3),hy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
  P.set([hx*k,(hy+2.5)*k,rnd(-1,1)*2.4*(.4+.6*k)],i*3);D[i]=rnd(0,.5);T[i]=rnd(-.14,.14);O[i]=rnd(.6,.85);Cl.set(pal[i%4],i*3);}
 const A=(a,n)=>new THREE.InstancedBufferAttribute(a,n);
 g.setAttribute('iPos',A(P,3));g.setAttribute('iDelay',A(D,1));g.setAttribute('iTilt',A(T,1));g.setAttribute('iOp',A(O,1));g.setAttribute('iCol',A(Cl,3));
 hMat=new THREE.ShaderMaterial(Object.assign({uniforms:{uMap:{value:tex},uEmerge:{value:0},uScale:{value:8},uBeat:{value:1},uRotY:{value:0},uRotX:{value:0},uWord:{value:30},uCenter:{value:new THREE.Vector2()}},
 vertexShader:'attribute vec3 iPos,iCol;attribute float iDelay,iTilt,iOp;uniform float uEmerge,uScale,uBeat,uRotY,uRotX,uWord;uniform vec2 uCenter;varying vec2 vUv;varying vec3 vC;varying float vA;'+
 'float eob(float x){float a=1.70158,b=a+1.;return 1.+b*pow(x-1.,3.)+a*pow(x-1.,2.);}'+
 'void main(){float p=clamp((uEmerge-iDelay)/.65,0.,1.);vec3 q=iPos*uScale*eob(p)*uBeat;'+
 'float cy=cos(uRotY),sy=sin(uRotY);q=vec3(q.x*cy+q.z*sy,q.y,-q.x*sy+q.z*cy);'+
 'float cx=cos(uRotX),sx=sin(uRotX);q=vec3(q.x,q.y*cx-q.z*sx,q.y*sx+q.z*cx);'+
 'vec4 mv=modelViewMatrix*vec4(q+vec3(uCenter,0.),1.);float ct=cos(iTilt),st=sin(iTilt);'+
 'vec2 o=position.xy*vec2(uWord,uWord*.375);o=vec2(o.x*ct-o.y*st,o.x*st+o.y*ct);mv.xy+=o*min(p*1.5,1.);'+
 'vA=iOp*p*mix(.4,1.,clamp(q.z/(uScale*5.)+.5,0.,1.));vUv=uv;vC=iCol;gl_Position=projectionMatrix*mv;}',
 fragmentShader:'uniform sampler2D uMap;varying vec2 vUv;varying vec3 vC;varying float vA;void main(){gl_FragColor=vec4(vC,texture2D(uMap,vUv).a*vA);}'},add));
 heart=new THREE.Mesh(g,hMat);heart.frustumCulled=false;heart.renderOrder=3;scene.add(heart);
}

// --- ekran düzeni
function layout(){
 W=innerWidth;H=innerHeight;renderer.setSize(W,H);camZ=(H/2)/Math.tan(25*Math.PI/180);
 camera.aspect=W/H;camera.position.z=camZ;camera.updateProjectionMatrix();U.uCamZ.value=camZ;
 portrait=W<H*.9;
 R=portrait?W*.3:Math.min(H*.24,W*.14);wordW=portrait?W*.66:W*.3;
 const oy=H*.04;C0=portrait?[{x:0,y:H*.17+oy},{x:0,y:-H*.17+oy}]:[{x:-W*.22,y:oy},{x:W*.22,y:oy}];
 hc={x:0,y:H*(portrait?.07:.04)};
 S=Math.min(W*.46/32,H*.3/30);
 if(hMat){hMat.uniforms.uScale.value=S;hMat.uniforms.uWord.value=S*3.8;hMat.uniforms.uCenter.value.set(hc.x,hc.y);}
 const sp=stars.geometry.attributes.position;for(let i=0;i<sp.count;i++)sp.setXYZ(i,rnd(-W*.9,W*.9),rnd(-H*.9,H*.9),rnd(-400,-50));sp.needsUpdate=true;
}

// --- durum
let T=0,m,mp,cm,ct,mt,he,bt,PH,spinMul,flash,dustA,rotY,rotX,velY,grab=-1,dragging=false,lastIdx,mS,subTimer,hintTimer;
function setHint(s){$('hint').style.opacity=s?.8:0;if(s)$('hint').textContent=s;}
function init(){
 subTimer=null;clearTimeout(hintTimer);core.material.opacity=0;
 state='intro';m=mp=cm=ct=mt=he=bt=PH=0;spinMul=1;flash=0;dustA=1;rotY=rotX=velY=0;lastIdx=-1;grab=-1;dragging=false;
 buildDust();dust.visible=true;dustMat.uniforms.uA.value=1;hMat.uniforms.uEmerge.value=0;
 $('foot').style.opacity=0;setHint('bas ekranaa!!!!!1');
}
function startMorph(){
 state='morph';setHint('');
 if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();
}
function startMerge(){state='merge';mt=0;grab=-1;mS=cen.map(c=>({x:c.x,y:c.y}));setHint('');if(CFG.vibrate&&navigator.vibrate)navigator.vibrate(15);}

// --- ses
let actx=null,soundOn=true;
function thump(v){if(!actx||!soundOn)return;const t=actx.currentTime;
 [[75,38,'sine',v],[130,70,'triangle',v*.45]].forEach(([f0,f1,ty,vol])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=ty;
 o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.16);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);
 o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+.26);});}
const env=x=>x<0?0:(x<.06?x/.06:Math.exp(-(x-.06)/.09));

// --- toz güncelleme
function updateDust(){
 const CA=CFG.colA,CB=CFG.colB;
 for(let i=0;i<N;i++){
  const g=gi[i],h=hist[g],k=(hp-lag[i]+HL)%HL,cx=h[k*2],cy=h[k*2+1],r=rr[i];
  const a=th[i]+PH/(r*.8+.25),gx=Math.cos(a)*r*R,gy=Math.sin(a)*r*R*.6,tl=g?.5:-.5,cs=Math.cos(tl),sn=Math.sin(tl);
  const mi=ease(clamp(m*1.65-dl[i],0,1));
  let x=lerp(tx[i]+Math.sin(T*3+i)*1.1,cx+gx*cs-gy*sn,mi),y=lerp(ty[i]+Math.cos(T*2.7+i)*1.1,cy+gx*sn+gy*cs,mi);
  const sw=Math.sin(mi*3.14159)*.45,dx=x-cx,dy=y-cy;x-=dy*sw;y+=dx*sw;
  if(ct>0){const q=1-ease(ct);x=hc.x+(x-hc.x)*q;y=hc.y+(y-hc.y)*q;}
  POS[i*3]=x;POS[i*3+1]=y;
  const b=g?CB:CA,o=g?CA:CB,mc=cm*mx[i],w=clamp(Math.pow(1-Math.min(r,1),2.2)*.85*mi+ct,0,1),br=lerp(1,r>1?.55:(r>.8?1-(r-.8)*1.2:1),mi);
  COL[i*3]=lerp(lerp(b[0],o[0],mc),1,w)*br;COL[i*3+1]=lerp(lerp(b[1],o[1],mc),1,w)*br;COL[i*3+2]=lerp(lerp(b[2],o[2],mc),1,w)*br;
 }
 dg.attributes.position.needsUpdate=true;dg.attributes.col.needsUpdate=true;
}

function update(dt){
 T+=dt;stars.material.uniforms.uT.value=T;
 if(state==='morph'){mp+=dt/3;m=Math.min(mp,1);if(mp>=1){state='drag';setHint('birlesdirr!!!!');}}
 if(state==='drag'){m=1;
  cen.forEach((c,g)=>{if(g===grab){c.x+=(c.tx-c.x)*.25;c.y+=(c.ty-c.y)*.25;}});
  const d=Math.hypot(cen[0].x-cen[1].x,cen[0].y-cen[1].y);
  if(grab>=0&&d<2*R){const o=cen[1-grab],c=cen[grab],pull=(1-d/(2*R))*dt*2.2;o.x+=(c.x-o.x)*pull;o.y+=(c.y-o.y)*pull;}
  if(d<1.1*R)startMerge();}
 if(state==='merge'){mt+=dt;const k=Math.min(mt/3.2,1);cm=k;spinMul=1+3*k*k;
  cen.forEach((c,g)=>{c.x=lerp(mS[g].x,hc.x,k*k);c.y=lerp(mS[g].y,hc.y,k*k);});if(mt>=3.2){state='collapse';ct=0;}}
 if(state==='collapse'){ct+=dt/1.4;if(ct>=1){ct=1;state='heart';he=0;bt=0;flash=.5;}}
 PH+=dt*spinMul*.5;
 hp=(hp+1)%HL;for(let g=0;g<2;g++){hist[g][hp*2]=cen[g].x;hist[g][hp*2+1]=cen[g].y;}
 // parıltılar
 const showG=(state==='drag'||state==='morph')?clamp((m-.5)*2,0,1)*.4:0;
 glowA.position.set(cen[0].x,cen[0].y,0);glowB.position.set(cen[1].x,cen[1].y,0);
 glowA.scale.setScalar(R*.8);glowB.scale.setScalar(R*.8);
 glowA.material.opacity=state==='merge'?showG||(.4*(1-cm)):showG;glowB.material.opacity=glowA.material.opacity;
 let bScale=1,aura=0;
 if(state==='merge'){core.position.set(hc.x,hc.y,0);core.scale.setScalar(R*(.5+2*cm));core.material.opacity=.15+.5*cm;}
 else if(state==='collapse'){core.scale.setScalar(R*(2.5-1.6*ease(ct)));core.material.opacity=.7+.3*ct;}
 else if(state==='heart'){
  bt+=dt;const P=CFG.period,ph=bt%P,b=.07*env(ph)+.045*env(ph-.26);bScale=1+b;aura=b;
  const idx=Math.floor(bt/P)*2+(ph>=.26?1:0);if(idx!==lastIdx){lastIdx=idx;thump(ph<.26?.9:.55);if(CFG.vibrate&&navigator.vibrate)navigator.vibrate(ph<.26?25:12);}
  he+=dt/1.8;if(he>.9&&!subTimer){subTimer=1;$('foot').style.opacity=1;}
  if(!dragging){velY*=Math.pow(.95,dt*60);rotY+=velY*dt*60+.15*dt;}
  core.scale.setScalar(S*26*(1+aura*1.5));core.material.opacity=.42*(.85+aura*3);
  dustA=Math.max(0,dustA-dt*1.5);dustMat.uniforms.uA.value=dustA;if(dustA<=0)dust.visible=false;
 }
 if(state==='intro'||state==='morph'||state==='drag'||state==='merge'||state==='collapse')updateDust();
 else if(dust.visible)updateDust();
 core.position.set(hc.x,hc.y,0);
 const u=hMat.uniforms;u.uEmerge.value=Math.min(he*1.2,1.3);u.uBeat.value=bScale;u.uRotY.value=rotY;u.uRotX.value=rotX;
 const sA=streaks[0].material;const sk=state==='intro'?1:Math.max(0,1-m*1.6);streaks.forEach(s=>{s.material.opacity=sk;s.visible=sk>0;});
 flash=Math.max(0,flash-dt*.9);$('flash').style.opacity=flash;
}
let last=performance.now();
function frame(now){const dt=Math.min((now-last)/1000,.05);last=now;if(state!=='load')update(dt);renderer.render(scene,camera);requestAnimationFrame(frame);}

// --- kontroller
addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;
 const px=e.clientX-W/2,py=H/2-e.clientY;
 if(state==='intro'){startMorph();return;}
 if(state==='drag'){let best=-1,bd=1e9;cen.forEach((c,g)=>{const d=Math.hypot(c.x-px,c.y-py);if(d<R*1.5&&d<bd){bd=d;best=g;}});
  if(best>=0){grab=best;cen[best].tx=px;cen[best].ty=py;if(CFG.vibrate&&navigator.vibrate)navigator.vibrate(8);}}
 if(state==='heart'){dragging=true;window._lx=e.clientX;window._ly=e.clientY;velY=0;setHint('');}
});
addEventListener('pointermove',e=>{
 if(grab>=0&&state==='drag'){cen[grab].tx=clamp(e.clientX-W/2,-W/2+R*.4,W/2-R*.4);cen[grab].ty=clamp(H/2-e.clientY,-H/2+R*.4,H/2-R*.4);}
 if(dragging){const dx=e.clientX-window._lx,dy=e.clientY-window._ly;rotY+=dx*.008;velY=dx*.008;rotX=clamp(rotX+dy*.005,-.45,.45);window._lx=e.clientX;window._ly=e.clientY;}
});
addEventListener('pointerup',()=>{grab=-1;dragging=false;});
addEventListener('pointercancel',()=>{grab=-1;dragging=false;});
$('snd').onclick=()=>{soundOn=!soundOn;$('snd').textContent='Ses: '+(soundOn?'açık':'kapalı');};
$('rst').onclick=()=>{subTimer=null;init();};
let lw=0,lp=null;
addEventListener('resize',()=>{const pw=portrait;layout();
 if(state!=='load'&&state!=='heart'&&(pw!==portrait||Math.abs(innerWidth-lw)>innerWidth*.1)){init();}
 lw=innerWidth;});

// --- başlat
layout();lw=innerWidth;
Promise.race([Promise.all([document.fonts.load('300 20px Poppins','Ekrana toxun İkisini ortaya gətir, qovuşdur Səni çooox sevirəmm'),document.fonts.load('600 170px Poppins','NİHAD ZEHRA'),document.fonts.load('600 150px Poppins','Zehra')]),new Promise(r=>setTimeout(r,3500))]).then(()=>{buildHeart();layout();init();});
requestAnimationFrame(frame);
</script>
